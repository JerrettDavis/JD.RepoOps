name: Release Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate reusable package release workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/reusable-release-package.yml
          test -f .github/actions/setup-dotnet/action.yml
          ! grep -R $'\t' .github/workflows/reusable-release-package.yml .github/actions/setup-dotnet/action.yml
