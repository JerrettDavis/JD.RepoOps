name: Release Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate reusable package release workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f templates/workflows/reusable-release-package.yml
          test -f .github/actions/setup-dotnet/action.yml
          ! grep -R $'\t' templates/workflows/reusable-release-package.yml .github/actions/setup-dotnet/action.yml
