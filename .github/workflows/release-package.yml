name: Release Package

on:
  workflow_call:
    inputs:
      metadata_file:
        required: false
        type: string
        default: .github/repoops.yml
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  self-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate automation assets
        shell: bash
        run: |
          if [ ! -d .github/actions ] || [ ! -d docs ]; then
            echo "Skipping JD.RepoOps asset checks outside the platform repository."
            exit 0
          fi
          test -f .github/workflows/pr-validation.yml
          test -f .github/workflows/publish-docs.yml
          test -f .github/workflows/release-package.yml
          test -f .github/actions/setup-dotnet/action.yml
          test -f .github/actions/build-dotnet/action.yml
          test -f .github/actions/test-dotnet/action.yml
          ! grep -R $'\t' .github docs README.md

  release:
    if: ${{ github.repository != 'JerrettDavis/JD.RepoOps' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: JerrettDavis/JD.RepoOps/.github/actions/setup-dotnet@main
        with:
          sdk_versions: "8.0.x,9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack --configuration Release --no-build -o ./artifacts

      - name: Publish NuGet
        run: echo "TODO: push to NuGet"
