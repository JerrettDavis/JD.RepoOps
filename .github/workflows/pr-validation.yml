name: PR Validation

on:
  workflow_call:
    inputs:
      metadata_file:
        required: false
        type: string
        default: .github/repoops.yml

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: JerrettDavis/JD.RepoOps/.github/actions/setup-dotnet@main
        with:
          sdk_versions: "8.0.x,9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"
